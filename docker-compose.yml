services:
  postgres:
    image: postgres:16-alpine
    container_name: nusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nusa_creator
      POSTGRES_USER: nusa
      POSTGRES_PASSWORD: nusa_secret
    ports:
      - "5434:5432"
    volumes:
      - nusa_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nusa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    container_name: nusa_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nusa_minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: nusa_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  n8n:
    image: n8nio/n8n:latest
    container_name: nusa_n8n
    restart: unless-stopped
    profiles:
      - automation
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Jakarta
    volumes:
      - nusa_n8n_data:/home/node/.n8n

volumes:
  nusa_postgres_data:
  nusa_minio_data:
  nusa_n8n_data:
